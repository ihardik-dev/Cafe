name: Cafe Backend CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: cafe_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify TypeScript Compilation
        run: npx tsc --noEmit

      - name: Push Database Schema
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/cafe_test_db?schema=public"
        run: npx prisma db push

      - name: Seed Database
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/cafe_test_db?schema=public"
        run: npm run prisma:seed

      - name: Run Automated Adversarial Test Suite
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/cafe_test_db?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "test-super-secret-cafe-jwt-key-minimum-32-chars-long"
          JWT_REFRESH_SECRET: "test-super-secret-cafe-jwt-refresh-key-minimum-32-chars"
          WEBHOOK_SECRET: "whsec_test_secret_for_ci_pipeline"
        run: npm test
