version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cafe_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cafe_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cafe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cafe_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cafe_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/cafe_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "super-secret-cafe-jwt-key-minimum-32-chars-long"
      JWT_REFRESH_SECRET: "super-secret-cafe-jwt-refresh-key-minimum-32-chars-long"
      WEBHOOK_SECRET: "whsec_test_cafe_secret_key_12345"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
